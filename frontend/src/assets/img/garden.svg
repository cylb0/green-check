<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <linearGradient id="skyMin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF8EA"/>
      <stop offset="1" stop-color="#4FAE6C"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="300" height="600" fill="url(#skyMin)"/>

  <!-- soft sun glow, minimal -->
  <circle cx="64" cy="88" r="58" fill="#FFFFFF" opacity="0.18"/>

  <!-- minimal cloud, two circles only -->
  <g opacity="0.5" fill="#F3FBF2">
    <circle cx="220" cy="70" r="22"/>
    <circle cx="245" cy="76" r="16"/>
  </g>

  <!-- ground band, single flat shape, no texture -->
  <path d="M0 472c60-14 120 6 160-2s90-10 140 4v126H0z" fill="#1F5B3B"/>

  <!-- garden stake, planted at 3/4 of the width -->
  <line x1="225" y1="245" x2="225" y2="472" stroke="#8B6B44" stroke-width="3" stroke-linecap="round"/>

  <!-- tomato plant stem -->
  <path d="M225 472c-2-72 5-140 9-198" stroke="#256B45" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- leaves: one flat almond silhouette, reused via transform, pulled in close to the stem -->
  <g>
    <path d="M0 0C8 -14 24 -14 32 0C24 14 8 14 0 0Z" fill="#2E7D4F" transform="translate(209,432) rotate(-150) scale(0.9)"/>
    <path d="M0 0C8 -14 24 -14 32 0C24 14 8 14 0 0Z" fill="#2E7D4F" transform="translate(236,416) rotate(20)"/>
    <path d="M0 0C8 -14 24 -14 32 0C24 14 8 14 0 0Z" fill="#4FAE6C" transform="translate(206,376) rotate(-170) scale(0.85)"/>
    <path d="M0 0C8 -14 24 -14 32 0C24 14 8 14 0 0Z" fill="#2E7D4F" transform="translate(239,358) rotate(15) scale(0.95)"/>
    <path d="M0 0C8 -14 24 -14 32 0C24 14 8 14 0 0Z" fill="#4FAE6C" transform="translate(223,298) rotate(-90) scale(1.1)"/>
  </g>

  <!-- tomatoes cluster, pulled in close to the stem -->
  <g>
    <circle cx="223" cy="255" r="13" fill="#E5533D"/>
    <circle cx="237" cy="275" r="11" fill="#D8432C"/>
    <circle cx="211" cy="278" r="10" fill="#E5533D"/>
    <g fill="#FF8A72" opacity="0.6">
      <ellipse cx="219" cy="250" rx="3" ry="2"/>
      <ellipse cx="233" cy="271" rx="2.6" ry="1.8"/>
      <ellipse cx="208" cy="274" rx="2.4" ry="1.6"/>
    </g>
  </g>
</svg>
