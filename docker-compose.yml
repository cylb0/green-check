services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_LEAF_DETECTION_MODEL_PATH: ${VITE_LEAF_DETECTION_MODEL_PATH}
        VITE_LEAF_SCAN_CONFIDENCE_TRESHOLD: ${VITE_LEAF_SCAN_CONFIDENCE_TRESHOLD}
        VITE_LEAF_DETECTION_DEBUG: ${VITE_LEAF_DETECTION_DEBUG}
    networks:
      - greencheck-frontend-nw
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MEDIA_ROOT=/vol/media
      - STATIC_ROOT=/vol/static
    volumes:
      - ./backend:/app:ro
      - media_data:/vol/media
      - static_data:/vol/static
    depends_on:
      db:
        condition: service_healthy
    networks:
      - greencheck-frontend-nw
      - greencheck-backend-nw
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - greencheck-backend-nw
    restart: always

  worker:
    build: ./backend
    entrypoint: []
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      - MEDIA_ROOT=/vol/media
    volumes:
      - ./backend:/app:ro
      - media_data:/vol/media
    depends_on:
      - redis
      - ai-service
    networks:
      - greencheck-backend-nw
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greencheck-backend-nw
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ai-service:/app:ro
    depends_on:
      - backend
    networks:
      - greencheck-backend-nw
    restart: unless-stopped

  training:
    build: ./training
    shm_size: "2gb"
    volumes:
      - ./training:/app
    profiles: ["training"]
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: greencheck-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/vol/media:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      - frontend
      - backend
    networks:
      - reverse-proxy-nw
      - greencheck-frontend-nw

volumes:
  db_data:
  media_data:
  static_data:

networks:
  reverse-proxy-nw:
    external: true
  greencheck-backend-nw:
    internal: true
  greencheck-frontend-nw:
    internal: true
